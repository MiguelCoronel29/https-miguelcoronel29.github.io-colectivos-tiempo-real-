<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transmisor GPS - Chofer</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            margin: 20px 0 30px;
            font-size: 26px;
        }

        .container {
            max-width: 380px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-size: 17px;
            text-align: left;
        }

        select {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border-radius: 8px;
            background: #222;
            color: white;
            border: none;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            margin: 10px 0;
            cursor: pointer;
        }

        #startBtn {
            background: #0066ff;
        }

        #startBtn.stop {
            background: #ff4444;
        }

        #status {
            margin: 25px auto;
            padding: 18px;
            background: #222;
            border-radius: 10px;
            font-size: 16px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info {
            margin-top: 40px;
            font-size: 14px;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚌 Transmisor GPS</h1>

        <label for="vehiculoSelect"><strong>Interno del colectivo:</strong></label>
        <select id="vehiculoSelect">
            <option value="interno_01">Interno 01</option>
            <option value="interno_02">Interno 02</option>
            <option value="interno_03">Interno 03</option>
            <option value="interno_04">Interno 04</option>
            <option value="interno_05">Interno 05</option>
        </select>

        <button id="startBtn">▶ Iniciar Transmisión</button>

        <p id="status">Presione el botón para comenzar</p>

        <div class="info">
            Mantenga esta página abierta.<br>
            Active el GPS y permita el acceso a la ubicación.
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLQTF45rPS0zUUNchDJ5DagygX8nojMxE",
            authDomain: "colectivos-tiempo-real.firebaseapp.com",
            databaseURL: "https://colectivos-tiempo-real-default-rtdb.firebaseio.com",
            projectId: "colectivos-tiempo-real",
            storageBucket: "colectivos-tiempo-real.firebasestorage.app",
            messagingSenderId: "454978508967",
            appId: "1:454978508967:web:be55f535a0504029b5e382"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const status = document.getElementById('status');
        const vehiculoSelect = document.getElementById('vehiculoSelect');
        const startBtn = document.getElementById('startBtn');

        let selectedVehicle = vehiculoSelect.value;
        let intervalId = null;

        vehiculoSelect.addEventListener('change', () => {
            selectedVehicle = vehiculoSelect.value;
        });

        startBtn.addEventListener('click', () => {
            if (intervalId !== null) {
                clearInterval(intervalId);
                intervalId = null;
                startBtn.textContent = '▶ Iniciar Transmisión';
                startBtn.classList.remove('stop');
                status.innerHTML = 'Transmisión detenida.';
                return;
            }

            if (!navigator.geolocation) {
                status.innerHTML = '❌ GPS no disponible en este dispositivo';
                return;
            }

            startBtn.textContent = '⏹ Detener Transmisión';
            startBtn.classList.add('stop');
            status.innerHTML = `Transmitiendo como <b>${selectedVehicle}</b><br>Cada 25 segundos...`;

            intervalId = setInterval(() => {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const data = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            speed: position.coords.speed || 0,
                            heading: position.coords.heading || 0,
                            updated_at: Date.now(),
                            online: true
                        };

                        db.ref(`lines/linea_1/vehicles/${selectedVehicle}`).set(data)
                            .then(() => {
                                status.innerHTML = `✅ Enviado correctamente<br>${selectedVehicle}`;
                            })
                            .catch(err => {
                                console.error(err);
                                status.innerHTML = '❌ Error al enviar a Firebase';
                            });
                    },
                    (error) => {
                        status.innerHTML = '❌ Error GPS: ' + error.message;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }, 3000);
        });
    </script>
</body>

</html>
