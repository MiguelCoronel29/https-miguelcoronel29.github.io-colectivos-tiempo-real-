<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transmisor GPS - Chofer</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="css/transmisor.css">
</head>

<body>

    <div class="container">
        <h1>🚌 Transmisor GPS</h1>

        <label for="ramalSelect"><strong>Ramal:</strong></label>
        <select id="ramalSelect">
            <option value="A">A - González Catán ↔ Correo Central</option>
            <option value="B">B - González Catán ↔ Primera Junta</option>
            <option value="C">C - San Alberto / Primera Junta</option>
            <option value="D">D - San Justo / Primera Junta</option>
        </select>

        <label for="colectivoSelect"><strong>Número de Colectivo:</strong></label>
        <select id="colectivoSelect">
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
        </select>

        <button id="startBtn">▶ Iniciar Transmisión</button>
        <button id="endBtn" class="hidden">⏹ Finalizar Recorrido</button>

        <p id="status">Seleccione ramal y colectivo</p>

        <div class="info">
            Mantenga esta página abierta.<br>
            Active el GPS y permita el acceso a la ubicación.
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLQTF45rPS0zUUNchDJ5DagygX8nojMxE",
            authDomain: "colectivos-tiempo-real.firebaseapp.com",
            databaseURL: "https://colectivos-tiempo-real-default-rtdb.firebaseio.com",
            projectId: "colectivos-tiempo-real",
            storageBucket: "colectivos-tiempo-real.firebasestorage.app",
            messagingSenderId: "454978508967",
            appId: "1:454978508967:web:be55f535a0504029b5e382"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const status = document.getElementById('status');
        const ramalSelect = document.getElementById('ramalSelect');
        const colectivoSelect = document.getElementById('colectivoSelect');
        const startBtn = document.getElementById('startBtn');
        const endBtn = document.getElementById('endBtn');

        let selectedVehicle = '';
        let intervalId = null;
        let isTransmitting = false;

        function updateSelectedVehicle() {
            selectedVehicle = ramalSelect.value + colectivoSelect.value;
        }

        ramalSelect.addEventListener('change', updateSelectedVehicle);
        colectivoSelect.addEventListener('change', updateSelectedVehicle);

        // Escuchar ocupación en tiempo real
        db.ref('lines/linea_1/vehicles').on('value', (snapshot) => {
            const vehicles = snapshot.val() || {};
            const occupied = Object.keys(vehicles).filter(key => vehicles[key].online === true);
            
            // Actualizar opciones disponibles
            Array.from(colectivoSelect.options).forEach(option => {
                const fullId = ramalSelect.value + option.value;
                option.disabled = occupied.includes(fullId);
            });
        });

        startBtn.addEventListener('click', () => {
            if (isTransmitting || !selectedVehicle) return;

            if (!navigator.geolocation) {
                status.innerHTML = '❌ GPS no disponible';
                return;
            }

            isTransmitting = true;
            startBtn.classList.add('hidden');
            endBtn.classList.remove('hidden');
            status.innerHTML = `Transmitiendo <b>${selectedVehicle}</b>`;

            intervalId = setInterval(() => {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const data = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            speed: position.coords.speed || 0,
                            heading: position.coords.heading || 0,
                            updated_at: Date.now(),
                            online: true
                        };

                        db.ref(`lines/linea_1/vehicles/${selectedVehicle}`).set(data)
                            .catch(err => console.error(err));
                    },
                    (error) => console.error('GPS Error:', error),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }, 25000);
        });

        endBtn.addEventListener('click', () => {
            if (intervalId) clearInterval(intervalId);
            intervalId = null;
            isTransmitting = false;

            // Marcar como offline
            db.ref(`lines/linea_1/vehicles/${selectedVehicle}`).update({ online: false });

            startBtn.classList.remove('hidden');
            endBtn.classList.add('hidden');
            status.innerHTML = `Recorrido de ${selectedVehicle} finalizado.`;
        });

        // Inicializar
        updateSelectedVehicle();
    </script>
</body>
</html>
